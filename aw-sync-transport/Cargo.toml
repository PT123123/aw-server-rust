[package]
name = "aw-sync-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
aw-models = { path = "../aw-models" }
aw-inbox-datastore = { path = "../aw-inbox-datastore" }
async-trait = "0.1.89"
mdns-sd = "0.17.1"
reqwest = "0.13.1"
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["trace"] }
hostname = "0.4.2"
