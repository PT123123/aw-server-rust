[package]
name = "aw-dump"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"

# Internal dependencies (optional, strictly speaking not needed for mocking but good for types)
aw-models = { path = "../aw-models" }
clap = { version = "4.1", features = ["derive"] }
env_logger = "0.10"
